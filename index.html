<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeeae4" />
    <meta
      name="description"
      content="Contagem regressiva para o nosso casamento em 17 de outubro de 2026, às 18h."
    />
    <title>Contagem regressiva para o nosso sim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23eeeae4'/%3E%3Cpath d='M32 49S14 39 14 25a10 10 0 0 1 18-6 10 10 0 0 1 18 6c0 14-18 24-18 24Z' fill='none' stroke='%235b554f' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --paper: #eeeae4;
        --ink: #423e3a;
        --muted: #746e67;
        --line: rgba(66, 62, 58, 0.22);
        --serif: "Cormorant Garamond", Georgia, serif;
        --display: "Italiana", "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--serif);
      }

      .page {
        min-height: 100svh;
        display: grid;
        grid-template-columns: minmax(0, 1.22fr) minmax(390px, 0.78fr);
        overflow: hidden;
      }

      .photo {
        position: relative;
        min-height: 100svh;
        background:
          linear-gradient(90deg, transparent 70%, rgba(0, 0, 0, 0.14)),
          url("couple.jpeg") center 63% / cover no-repeat;
      }

      .photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 42%, rgba(0, 0, 0, 0.12));
        pointer-events: none;
      }

      .content {
        position: relative;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(2rem, 5vw, 6.5rem) clamp(1.5rem, 4vw, 5rem);
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.95), transparent 34%),
          linear-gradient(145deg, #f3f0eb, #e8e3dc);
      }

      .content::before {
        content: "";
        position: absolute;
        inset: clamp(1rem, 2.2vw, 2rem);
        border: 1px solid var(--line);
        pointer-events: none;
      }

      .inner {
        width: min(100%, 560px);
        position: relative;
        z-index: 1;
        text-align: center;
        animation: reveal 1.15s cubic-bezier(.2,.75,.2,1) both;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(3rem, 5.2vw, 5.6rem);
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.035em;
      }

      .flourish {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        width: min(240px, 56%);
        margin: 1.7rem auto;
        color: #77716b;
      }

      .flourish::before,
      .flourish::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--line);
      }

      .flourish span {
        font-size: 0.8rem;
        line-height: 1;
      }

      .date {
        margin: 0;
        font-size: clamp(1.15rem, 1.7vw, 1.4rem);
        font-weight: 500;
        letter-spacing: 0.045em;
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(0.45rem, 1vw, 0.9rem);
        margin: clamp(2rem, 5vh, 3.6rem) 0 2.2rem;
      }

      .unit {
        min-width: 0;
        padding: 1rem 0.3rem 0.8rem;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .number {
        display: block;
        font-family: var(--display);
        font-size: clamp(2.15rem, 4.2vw, 4rem);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .label {
        display: block;
        margin-top: 0.55rem;
        color: var(--muted);
        font-size: clamp(0.7rem, 1vw, 0.82rem);
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .message {
        max-width: 34rem;
        margin: 0 auto;
        font-size: clamp(1.13rem, 1.7vw, 1.42rem);
        font-style: italic;
        line-height: 1.55;
      }

      .closing {
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        letter-spacing: 0.08em;
      }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 820px) {
        .page {
          display: block;
          position: relative;
          min-height: 100svh;
          background: #2c2a28;
        }

        .photo {
          position: fixed;
          inset: 0;
          min-height: 100svh;
          background-position: center 64%;
        }

        .photo::after {
          background: linear-gradient(180deg, rgba(18, 17, 16, 0.15), rgba(18, 17, 16, 0.25));
        }

        .content {
          min-height: 100svh;
          padding: 1.15rem;
          align-items: flex-start;
          background: transparent;
        }

        .content::before {
          display: none;
        }

        .inner {
          width: 100%;
          margin: 0 auto;
          padding: clamp(1.4rem, 6vw, 2.2rem) clamp(1rem, 5vw, 1.8rem) 1.55rem;
          border: 1px solid rgba(255, 255, 255, 0.62);
          background: rgba(241, 237, 231, 0.9);
          backdrop-filter: blur(12px);
          box-shadow: 0 18px 60px rgba(0, 0, 0, 0.2);
        }

        h1 {
          font-size: clamp(2.65rem, 12vw, 4.25rem);
        }

        .countdown {
          margin: 1.65rem 0 1.5rem;
        }

        .unit {
          padding-block: 0.8rem 0.65rem;
        }
      }

      @media (max-width: 390px) {
        .label {
          font-size: 0.63rem;
          letter-spacing: 0.08em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .inner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="photo" role="img" aria-label="Casal abraçado em uma paisagem natural"></div>

      <section class="content" aria-labelledby="title">
        <div class="inner">
          <p class="eyebrow">Contagem regressiva</p>
          <h1 id="title">Para o nosso<br />grande dia</h1>

          <div class="flourish" aria-hidden="true"><span>♡</span></div>

          <p class="date">17 de outubro de 2026&nbsp; • &nbsp;18h</p>

          <div class="countdown" aria-live="polite" aria-label="Tempo restante para o casamento">
            <div class="unit"><span class="number" id="days">30</span><span class="label">dias</span></div>
            <div class="unit"><span class="number" id="hours">00</span><span class="label">horas</span></div>
            <div class="unit"><span class="number" id="minutes">00</span><span class="label">minutos</span></div>
            <div class="unit"><span class="number" id="seconds">00</span><span class="label">segundos</span></div>
          </div>

          <p class="message">
            Acompanhe-nos nesta emocionante contagem regressiva rumo ao grande dia de nossas vidas.
          </p>
          <p class="closing">O nosso para sempre está cada vez mais perto.</p>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const weddingDate = new Date("2026-10-17T18:00:00-03:00");
        const fields = {
          days: document.getElementById("days"),
          hours: document.getElementById("hours"),
          minutes: document.getElementById("minutes"),
          seconds: document.getElementById("seconds")
        };

        function twoDigits(value) {
          return String(value).padStart(2, "0");
        }

        function updateCountdown() {
          const remaining = weddingDate.getTime() - Date.now();

          if (remaining <= 0) {
            fields.days.textContent = "00";
            fields.hours.textContent = "00";
            fields.minutes.textContent = "00";
            fields.seconds.textContent = "00";
            document.querySelector(".message").textContent = "Chegou o grande dia das nossas vidas!";
            document.querySelector(".closing").textContent = "Hoje começa o nosso para sempre. ♡";
            return;
          }

          const totalSeconds = Math.floor(remaining / 1000);
          fields.days.textContent = String(Math.floor(totalSeconds / 86400));
          fields.hours.textContent = twoDigits(Math.floor((totalSeconds % 86400) / 3600));
          fields.minutes.textContent = twoDigits(Math.floor((totalSeconds % 3600) / 60));
          fields.seconds.textContent = twoDigits(totalSeconds % 60);
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
      })();
    </script>
  </body>
</html>
